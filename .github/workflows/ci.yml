name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Banned hmmlearn calls (FR-15)
        run: uv run python -m regport.regime.guard src
      - name: Data guard (no data/, secrets or files over 5 MB)
        run: uv run python scripts/check_tracked_files.py
      - name: Trial log is append-only
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_trial_log_append_only.py origin/${{ github.base_ref }}
      - name: Validate the trial log (overfitlab)
        shell: bash
        run: |
          if [ -f results/trial_log.csv ]; then
            uv run overfitlab trials validate results/trial_log.csv
          else
            echo "::notice::results/trial_log.csv does not exist yet; validation skipped"
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -m "not data and not slow and not bench and not xcheck" --cov=regport --cov-report=term --cov-fail-under=85

  xcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --group xcheck
      - run: uv run pytest -m xcheck
