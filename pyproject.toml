[project]
name = "regport"
version = "0.1.0"
description = "Leakage-free regime detection and portfolio construction, tested out of sample against 1/N."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "polars>=1.20",
    "pyarrow>=18",
    "duckdb>=1.1",
    "cvxpy>=1.6",
    "clarabel>=0.9",
    "osqp>=0.6.7",
    "hmmlearn>=0.3.3",
    "scikit-learn>=1.5",
    "numba>=0.60",
    "typer>=0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "structlog>=24.4",
]

[project.scripts]
regport = "regport.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regport"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pre-commit>=4.0",
    "overfitlab",
]
xcheck = ["riskfolio-lib>=6.3"]
bench = ["pytest-benchmark>=4"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
overfitlab = { git = "https://github.com/avmhdt/backtest-overfitting-lab" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/regport"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "cvxpy.*",
    "hmmlearn.*",
    "numba.*",
    "pyarrow.*",
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "data: needs downloaded raw data or API keys (local only)",
    "slow: slow tests (local before milestone exit)",
    "xcheck: riskfolio-lib cross-checks (separate CI job)",
    "bench: pytest-benchmark scaling tests (local only)",
]

[tool.coverage.run]
branch = false
source_pkgs = ["regport"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '^\s*\.\.\.$']
